<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- KHÔNG có thẻ Content-Security-Policy (quyết định user 2026-08-12).
         Trang này gọi mạng tới 3 nhóm đích, và 2 trong 3 KHÔNG thể biết trước lúc build: socket/REST của nhà
         cung cấp (host do sòng cấp lúc chạy, qua `?platformUrl=`) và CDN asset (Project Settings > Build
         Server). Một `connect-src 'self'` mặc định vì vậy chỉ chặn đúng những thứ game phải làm để chạy được,
         và triệu chứng ("violates the following Content Security Policy directive") không hề chỉ về file này.
         Sòng/CDN nào cần CSP thì đặt bằng HTTP header ở tầng server — nơi biết host thật. -->
    <!-- Web app đứng riêng: iOS "Add To Home Screen" + Android "Install app" (xem src/main/web_app_assets.ts).
         iOS BỎ QUA `manifest.webmanifest` cho phần này nên bộ `apple-*` bên dưới là BẮT BUỘC, không thừa. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` (KHÔNG phải `black-translucent`): translucent đẩy canvas lên dưới thanh trạng thái/tai thỏ,
         mà engine chưa có safe area nên UI neo mép trên sẽ nằm dưới đồng hồ. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cabo" />
    <meta name="theme-color" content="#000000" />
    <!-- Chuỗi số trong game không bị iOS tự biến thành link gọi điện. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Cabo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      #pixi-creator-root {
        /* Tắt tính năng chọn văn bản */
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 và Windows Phone */
        user-select: none; /* Thẻ tiêu chuẩn cho Chrome, Opera, Firefox */

        /* Tắt menu ngữ cảnh (mũi tên, chia sẻ, sao chép) của iOS Safari */
        -webkit-touch-callout: none;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        left: 0;
        top: 0;
      }

      #pixi-creator-root canvas {
        /* Tắt tính năng chọn văn bản */
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 và Windows Phone */
        user-select: none; /* Thẻ tiêu chuẩn cho Chrome, Opera, Firefox */

        /* Tắt menu ngữ cảnh (mũi tên, chia sẻ, sao chép) của iOS Safari */
        -webkit-touch-callout: none;
        display: block;
        position: absolute;
        left: 0;
        top: 0;
      }

      #loading {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        z-index: 10;
        pointer-events: none;
      }

      /* Two gate halves meet in the middle; they slide apart when loading is done.
         The images themselves are in the <style> right after the #loading div. */
      .gate {
        position: absolute;
        top: 0;
        width: 50.3%;
        height: 100%;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        transition: transform 1.1s cubic-bezier(0.7, 0, 0.3, 1);
      }

      #gateL {
        left: 0;
      }

      #gateR {
        right: 0;
      }

      #loadingText {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 600 28px/1 sans-serif;
        letter-spacing: 2px;
        text-shadow: 0 2px 6px #000, 0 0 12px #000;
        transition: opacity 0.3s;
      }

      /* Game is ready: wait for the player's key press / click before opening. */
      #loading.waiting {
        pointer-events: auto;
        cursor: pointer;
      }

      #loading.waiting #loadingText {
        animation: loadingBlink 1.4s ease-in-out infinite;
      }

      @keyframes loadingBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      #loading.done #gateL {
        transform: translateX(-101%);
      }

      #loading.done #gateR {
        transform: translateX(101%);
      }

      #loading.done #loadingText {
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <div id="pixi-creator-root"></div>
    <div id="loading"><div id="gateL" class="gate"></div><div id="gateR" class="gate"></div><div id="loadingText">Loading...</div></div>
    <style>#gateL{background-image:url(main/gate_l.a1b2c3.webp)}#gateR{background-image:url(main/gate_r.a1b2c3.webp)}</style>
    <script>
      // The gate stays shut while the game loads. When the GAME says it is
      // ready (TurnManager.start sets window.__caboReady and fires "cabo-ready"
      // once the scene is loaded and running), the text changes to "Press any
      // key to start" and only THEN does a key press / click / tap open the
      // gate. Input before that moment is ignored. EXTRA_WAIT_MS gives the
      // first frames time to draw. SAFETY_MS shows the prompt anyway if the
      // ready signal never arrives, so the player is never stuck on "Loading...".
      (function () {
        var EXTRA_WAIT_MS = 500;
        var SAFETY_MS = 90000;
        var overlay = document.getElementById("loading");
        var text = document.getElementById("loadingText");
        window.__caboGate = true; // tells the game a start gate exists: hold the music until "cabo-started"
        var prompted = false;
        var scheduled = false;
        var opened = false;
        function open() {
          if (opened || !prompted) return;
          opened = true;
          window.removeEventListener("keydown", open, true);
          overlay.removeEventListener("pointerdown", open, true);
          overlay.className = "done";
          window.__caboStarted = true;
          try { window.dispatchEvent(new Event("cabo-started")); } catch (e) {}
          setTimeout(function () {
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }, 1400);
        }
        function showPrompt() {
          if (prompted) return;
          text.textContent = "Press any key to start";
          overlay.className = "waiting";
          // Registered after the text changes, so earlier presses never count.
          // Ignore auto-repeat from a key that was already held down.
          window.addEventListener("keydown", function (ev) {
            if (ev.repeat) return;
            open();
          }, true);
          overlay.addEventListener("pointerdown", open, true);
          prompted = true;
        }
        function ready() {
          if (scheduled) return;
          scheduled = true;
          setTimeout(showPrompt, EXTRA_WAIT_MS);
        }
        if (window.__caboReady) ready();
        window.addEventListener("cabo-ready", ready);
        setTimeout(showPrompt, SAFETY_MS);
      })();
    </script>

    <!-- ĐÚNG 2 thẻ script, đúng thứ tự này (xem CLAUDE.md's "ASSET BUNDLE + ASSET MANAGER + BUILD PIPELINE"):
         1. settings: gán `window._pc_settings` (cấu hình bootstrap + version của từng bundle).
         2. engine: phơi `window._pc_engine` rồi TỰ khởi động game khi thấy `_pc_settings`.

         Lúc build, 2 `src` này được thay bằng tên file CÓ VERSION (`settings.a1b2c.js`) — build dò bằng REGEX
         `settings(.<ver>)?.js` / `engine(.<ver>)?.js` chứ không phải token, nên file này vẫn là HTML đọc hiểu
         được và bạn sửa thoải mái (thêm loading screen, analytics, đổi CSS...). Thiếu 1 trong 2 thẻ thì BUILD
         BÁO LỖI thay vì xuất ra 1 bản không chạy được.

         Muốn dùng bản của riêng project: Native Menu > Project > Generate index.html (ghi ra
         <project>/local/build/index.html, build tự ưu tiên file đó). -->
    <script src="settings.8d892.js"></script>
    <script src="engine.74ebc.js"></script>
  </body>
</html>
